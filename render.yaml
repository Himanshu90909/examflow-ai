# Render blueprint. Free plan: no persistent disk, so SQLite lives in /tmp and the
# demo data reseeds when the instance restarts.
# To keep real timetables, upgrade the service to Starter and uncomment the disk block.
services:
  - type: web
    name: examflow-ai
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: EXAMFLOW_SECRET
        generateValue: true
      - key: EXAMFLOW_DB
        value: /tmp/examflow.db
      - key: EXAMFLOW_SEED
        value: "1"
